server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # PDF / pièces jointes : défaut nginx = 1m → 413 sans cette ligne
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

    # Fichier généré au build Docker : pas de cache pour confirmer la version déployée
    location = /build-info.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # Éviter un index.html obsolète après rebuild Docker (sinon l’utilisateur garde l’ancien JS en mémoire longtemps)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # API : le build utilise VITE_API_URL=/api/v1 — sans ce bloc, /api/* tombait sur try_files → index.html (HTML)
    # et le front plantait (ex. .map is not a function). Le nom d’hôte api-app1 = service Docker Compose.
    location /api/ {
        client_max_body_size 100M;
        proxy_pass http://api-app1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # SPA : ne jamais mettre en cache les réponses HTML (routes comme /projets renvoient index.html).
    # Sinon le navigateur garde un vieux index qui pointe vers d’anciens fichiers .js hashés.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

